<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accreditatie <?= eventName ?></title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --primary-color: <?= colorPrimary ?>;
        --secondary-color: <?= colorSecondary ?>;
        --bg-color: <?= colorBackground ?>;
      }
      
      body { 
        background-color: var(--bg-color); 
        font-family: 'Montserrat', sans-serif; 
        display: none; 
      }
      
      .container { max-width: 600px; margin-top: 30px; margin-bottom: 30px; }
      .card { 
        border: none; 
        border-radius: 10px; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        margin-bottom: 20px;
      }
      .card-header { 
        background-color: var(--primary-color) !important; 
        color: white; 
        border-radius: 10px 10px 0 0 !important; 
        font-weight: 600;
      }
      
      .btn-primary { 
        background-color: var(--primary-color) !important; 
        border: none; 
        font-weight: 600;
      }
      
      .btn-outline-primary {
        color: var(--primary-color);
        border-color: var(--primary-color);
        font-weight: 600;
      }
      
      .btn-outline-primary:hover {
        background-color: var(--primary-color);
        color: white;
      }
      
      .text-primary-custom { color: var(--primary-color) !important; }
      .remove-btn { color: white; cursor: pointer; float: right; font-size: 0.9em; text-decoration: underline;}
      
      .form-label {
        font-weight: 600;
        color: var(--secondary-color);
      }
    </style>
  </head>
  <body>
    <div class="container" id="app-container">
      <h2 class="text-center mb-4 text-primary-custom">Accreditatie <?= eventName ?></h2>
      
      <div id="forms-wrapper">
        <!-- Dynamische formulieren komen hier -->
      </div>
      
      <div class="d-grid gap-2">
        <button type="button" class="btn btn-outline-primary" onclick="addPersonForm()">+ Extra persoon toevoegen</button>
        <button type="button" class="btn btn-primary btn-lg mt-3" id="submitBtn" onclick="submitData()">Gegevens Opslaan</button>
      </div>
      
      <div id="success-message" class="alert alert-success mt-4" style="display:none;">
        <strong>Succesvol opgeslagen!</strong><br>Je kunt deze pagina nu veilig sluiten.
      </div>
    </div>

    <script>
      var sheetId = "<?= sheetId ?>";
      var ssUrl = "<?= ssUrl ?>";
      var headers = <?!= JSON.stringify(headers) ?>;
      var formCount = 0;

      // 1. Apparaat Detectie
      function isMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      }

      window.onload = function() {
        if (!isMobile()) {
          // Desktop: Redirect naar de sheet
          document.body.innerHTML = "<h3 style='text-align:center; margin-top:50px; color: var(--secondary-color);'>Je wordt doorgestuurd naar de spreadsheet...</h3>";
          document.body.style.display = "block";
          window.location.href = ssUrl;
        } else {
          // Mobiel: Toon het formulier
          document.body.style.display = "block";
          addPersonForm(); // Voeg in ieder geval 1 formulier toe
        }
      };

      // 2. Formulier opbouwen
      function addPersonForm() {
        formCount++;
        var wrapper = document.getElementById('forms-wrapper');
        
        var card = document.createElement('div');
        card.className = 'card person-form';
        card.id = 'form-' + formCount;
        
        var cardHeader = document.createElement('div');
        cardHeader.className = 'card-header';
        cardHeader.innerHTML = 'Persoon ' + formCount;
        if (formCount > 1) {
          cardHeader.innerHTML += ' <a class="remove-btn" onclick="removeForm(' + formCount + ')">Verwijder</a>';
        }
        card.appendChild(cardHeader);
        
        var cardBody = document.createElement('div');
        cardBody.className = 'card-body';
        
        // Genereer velden op basis van headers
        headers.forEach(function(h) {
          if(!h) return;
          var group = document.createElement('div');
          group.className = 'mb-3';
          
          var label = document.createElement('label');
          label.className = 'form-label';
          label.innerText = h;
          
          var input = document.createElement('input');
          input.type = 'text';
          input.className = 'form-control field-input';
          input.dataset.header = h;
          
          group.appendChild(label);
          group.appendChild(input);
          cardBody.appendChild(group);
        });
        
        card.appendChild(cardBody);
        wrapper.appendChild(card);
      }

      function removeForm(id) {
        var el = document.getElementById('form-' + id);
        if (el) el.remove();
      }

      // 3. Verzenden
      function submitData() {
        var btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = 'Bezig met opslaan...';
        
        var forms = document.querySelectorAll('.person-form');
        var dataToSubmit = [];
        
        forms.forEach(function(f) {
          var inputs = f.querySelectorAll('.field-input');
          var personData = {};
          var hasData = false;
          
          inputs.forEach(function(inp) {
            personData[inp.dataset.header] = inp.value;
            if (inp.value.trim() !== "") hasData = true;
          });
          
          if (hasData) {
            dataToSubmit.push(personData);
          }
        });
        
        if (dataToSubmit.length === 0) {
          alert('Vul minimaal één veld in om op te slaan.');
          btn.disabled = false;
          btn.innerText = 'Gegevens Opslaan';
          return;
        }

        google.script.run
          .withSuccessHandler(function() {
            document.getElementById('success-message').style.display = 'block';
            document.getElementById('forms-wrapper').style.display = 'none';
            document.querySelector('.d-grid').style.display = 'none';
          })
          .withFailureHandler(function(error) {
            alert('Fout bij opslaan: ' + error.message);
            btn.disabled = false;
            btn.innerText = 'Gegevens Opslaan';
          })
          .verwerkFormulier(sheetId, dataToSubmit);
      }
    </script>
  </body>
</html>
